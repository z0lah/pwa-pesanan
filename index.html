<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barokah Rasa - Pesanan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/sql-wasm.js"></script>
<script src="js/db-core.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/register-sw.js"></script>
</head>
<body>

<div class="header-bar">
    <h1>🍽️ Barokah Rasa</h1>
    <div class="subtitle">Manajemen Pesanan</div>
</div>

<div class="container">

    <div id="offlineStatus" class="alert alert-info" style="font-size:13px;">
        ⏳ Memeriksa kesiapan offline...
    </div>

    <div class="card">
        <div class="card-title">Ringkasan Hari Ini</div>
        <div id="ringkasan" class="muted">Memuat...</div>
    </div>

    <div id="backupReminder"></div>

    <div class="card">
        <div class="card-title">Daftar Pesanan</div>
        <div id="daftarPesanan">Memuat...</div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="barang.html" class="muted" style="text-decoration: underline;">📦 Kelola Daftar Barang</a>
        &nbsp;&middot;&nbsp;
        <a href="backup.html" class="muted" style="text-decoration: underline;">☁️ Backup Data</a>
    </div>

    <div style="text-align: center; margin-top: 10px;">
        <button onclick="forceUpdateApp()" class="muted" style="background:none; border:none; text-decoration: underline; cursor:pointer; font-size:13px;">
            🔄 Muat Ulang Versi Terbaru
        </button>
    </div>

</div>

<a href="buat.html" class="fab" title="Buat Pesanan Baru">+</a>

<script>
let api = null;

async function checkOfflineReadiness() {
    const statusEl = document.getElementById('offlineStatus');

    try {
        if (!('caches' in window)) {
            statusEl.textContent = '⚠️ Browser ini tidak mendukung Cache API (mode offline tidak tersedia).';
            statusEl.className = 'alert alert-warning';
            return;
        }

        // Cek status Service Worker TANPA menunggu tanpa batas -
        // getRegistrations() selalu selesai cepat, tidak seperti
        // navigator.serviceWorker.ready yang bisa macet kalau SW
        // tidak pernah aktif.
        let swStateInfo = 'Service Worker tidak didukung browser ini';
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            if (regs.length === 0) {
                swStateInfo = 'Service Worker belum terdaftar';
            } else {
                const reg = regs[0];
                const state = reg.active ? 'aktif' : (reg.waiting ? 'menunggu' : (reg.installing ? 'sedang instal' : 'tidak diketahui'));
                swStateInfo = 'Service Worker: ' + state;
            }
        }

        const filesToCheck = [
            'index.html', 'buat.html', 'edit.html', 'detail.html', 'barang.html', 'backup.html',
            'js/vendor/sql-wasm.js', 'js/vendor/sql-wasm.wasm',
            'js/app.js', 'js/db-core.js', 'js/storage.js', 'js/receipt.js', 'js/register-sw.js',
            'css/style.css'
        ];

        let cachedCount = 0;
        const missing = [];
        for (const file of filesToCheck) {
            const match = await caches.match(file);
            if (match) {
                cachedCount++;
            } else {
                missing.push(file);
            }
        }

        if (cachedCount === filesToCheck.length) {
            statusEl.textContent = '✅ Aplikasi siap dipakai 100% offline.';
            statusEl.className = 'alert alert-success';
            setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
        } else {
            statusEl.innerHTML =
                `⚠️ Belum siap offline (${cachedCount}/${filesToCheck.length} file ter-cache).<br>` +
                `<small>${swStateInfo}<br>Belum ke-cache: ${missing.join(', ')}</small>`;
            statusEl.className = 'alert alert-warning';
        }
    } catch (err) {
        statusEl.textContent = '❌ Gagal cek status: ' + err.message;
        statusEl.className = 'alert alert-danger';
    }
}

async function main() {
    await initDatabase();
    api = getAutoSaveDbApi();
    render();
}

checkOfflineReadiness();

function render() {
    renderRingkasan();
    renderDaftarPesanan();
    renderBackupReminder();
}

function renderBackupReminder() {
    const el = document.getElementById('backupReminder');
    const last = localStorage.getItem('lastBackupTimestamp');

    let daysAgo = null;
    if (last) {
        daysAgo = Math.floor((Date.now() - parseInt(last)) / (1000 * 60 * 60 * 24));
    }

    if (!last) {
        el.innerHTML = `
            <div class="alert alert-warning">
                ⚠️ Anda belum pernah backup data.
                <a href="backup.html" style="font-weight:bold;">Backup sekarang →</a>
            </div>`;
    } else if (daysAgo >= 3) {
        el.innerHTML = `
            <div class="alert alert-warning">
                ⚠️ Sudah ${daysAgo} hari sejak backup terakhir.
                <a href="backup.html" style="font-weight:bold;">Backup sekarang →</a>
            </div>`;
    } else {
        el.innerHTML = '';
    }
}

function renderRingkasan() {
    const r = api.getRingkasanHariIni();
    document.getElementById('ringkasan').innerHTML =
        `<strong>${r.jumlah_pesanan}</strong> pesanan hari ini &middot; ` +
        `Total: <strong style="color:#27ae60;">Rp ${r.total_pemasukan.toLocaleString('id-ID')}</strong>`;
}

function badgeClass(status) {
    if (status === 'Disiapkan') return 'badge-disiapkan';
    if (status === 'Siap Diambil') return 'badge-siap';
    return 'badge-diambil';
}

function renderDaftarPesanan() {
    const list = api.getPesananList();
    const container = document.getElementById('daftarPesanan');

    if (list.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                Belum ada pesanan.<br>
                Tekan tombol + untuk membuat pesanan baru.
            </div>`;
        return;
    }

    container.innerHTML = list.map(p => `
        <a href="detail.html?id=${p.id}" class="pesanan-list-item">
            <div style="display:flex; justify-content:space-between; align-items:start;">
                <div>
                    <strong>#${p.id} - ${p.nama_pemesan}</strong><br>
                    <span class="muted">${p.created_at}</span>
                </div>
                <div style="text-align:right;">
                    <span class="badge ${badgeClass(p.status)}">${p.status}</span><br>
                    <span style="color:#27ae60; font-weight:bold;">Rp ${p.total.toLocaleString('id-ID')}</span>
                </div>
            </div>
        </a>
    `).join('');
}

main();
</script>

</body>
</html>
