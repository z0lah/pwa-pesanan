<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Barang</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/sql-wasm.js"></script>
<script src="js/db-core.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/register-sw.js"></script>
</head>
<body>
 
<div class="header-bar">
    <h1>📦 Kelola Barang</h1>
    <div class="subtitle">Daftar menu yang bisa dipesan</div>
</div>
 
<div class="container">
    <a href="index.html" class="back-link">← Kembali ke Daftar Pesanan</a>
 
    <div class="card">
        <div class="card-title" id="formTitle">Tambah Barang Baru</div>
        <form id="formBarang">
            <div class="form-group">
                <label>Nama Barang *</label>
                <input type="text" id="namaBarang" class="form-control" required placeholder="Contoh: Nasi Goreng">
            </div>
            <div class="form-group">
                <label>Harga (Rp) *</label>
                <input type="number" id="hargaBarang" class="form-control" required min="0" step="1">
            </div>
            <button type="submit" class="btn btn-success" id="btnSubmitBarang">+ Tambah Barang</button>
            <button type="button" class="btn" style="background:#95a5a6; display:none;" id="btnBatalEdit" onclick="batalEdit()">Batal</button>
        </form>
    </div>
 
    <div class="card">
        <div class="card-title">Daftar Barang</div>
        <div id="daftarBarang">Memuat...</div>
    </div>
</div>
 
<script>
let api = null;
let editingId = null;
 
async function main() {
    await initDatabase();
    api = getAutoSaveDbApi();
    render();
}
 
function render() {
    const list = api.getBarangList(false);
    const container = document.getElementById('daftarBarang');
 
    if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">Belum ada barang. Tambahkan di atas.</div>';
        return;
    }
 
    container.innerHTML = list.map(b => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee;">
            <div>
                <strong>${b.nama}</strong>
                ${b.available ? '' : '<span class="muted"> (nonaktif)</span>'}<br>
                <span class="muted">Rp ${b.harga.toLocaleString('id-ID')}</span>
            </div>
            <div>
                <button onclick="mulaiEdit(${b.id})" class="btn" style="background:#3498db; padding: 6px 10px; font-size:12px;">
                    Edit
                </button>
                <button onclick="toggleAvailable(${b.id}, ${b.available})" class="btn" style="background:${b.available ? '#f39c12' : '#27ae60'}; padding: 6px 10px; font-size:12px;">
                    ${b.available ? 'Nonaktifkan' : 'Aktifkan'}
                </button>
                <button onclick="hapusBarang(${b.id})" class="btn btn-danger" style="padding: 6px 10px; font-size:12px;">Hapus</button>
            </div>
        </div>
    `).join('');
}
 
document.getElementById('formBarang').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nama = document.getElementById('namaBarang').value.trim();
    const harga = parseFloat(document.getElementById('hargaBarang').value);
 
    if (!nama || isNaN(harga)) return;
 
    if (editingId !== null) {
        // Mode edit: pertahankan status available yang sudah ada
        const existing = api.getBarangList(false).find(x => x.id === editingId);
        await api.updateBarang(editingId, nama, harga, existing ? existing.available : 1);
        batalEdit(); // reset form kembali ke mode "tambah"
    } else {
        await api.addBarang(nama, harga, 1);
        document.getElementById('formBarang').reset();
    }
 
    render();
});
 
function mulaiEdit(id) {
    const b = api.getBarangList(false).find(x => x.id === id);
    if (!b) return;
 
    editingId = id;
    document.getElementById('namaBarang').value = b.nama;
    document.getElementById('hargaBarang').value = b.harga;
 
    document.getElementById('formTitle').textContent = 'Edit Barang: ' + b.nama;
    document.getElementById('btnSubmitBarang').textContent = '💾 Simpan Perubahan';
    document.getElementById('btnBatalEdit').style.display = 'inline-block';
 
    // Scroll ke form supaya terlihat, terutama kalau barangnya di bawah
    document.getElementById('formBarang').scrollIntoView({ behavior: 'smooth' });
}
 
function batalEdit() {
    editingId = null;
    document.getElementById('formBarang').reset();
    document.getElementById('formTitle').textContent = 'Tambah Barang Baru';
    document.getElementById('btnSubmitBarang').textContent = '+ Tambah Barang';
    document.getElementById('btnBatalEdit').style.display = 'none';
}
 
async function toggleAvailable(id, currentAvailable) {
    const b = api.getBarangList(false).find(x => x.id === id);
    await api.updateBarang(id, b.nama, b.harga, currentAvailable ? 0 : 1);
    render();
}
 
async function hapusBarang(id) {
    if (!confirm('Hapus barang ini? (Pesanan lama yang sudah ada tidak akan berubah)')) return;
    await api.deleteBarang(id);
    if (editingId === id) {
        batalEdit();
    }
    render();
}
 
main();
</script>
 
</body>
</html>
